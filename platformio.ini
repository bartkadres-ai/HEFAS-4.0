; HEFAS STM – Arduino Nicla Vision (ToF + IMU → HID mysz)

[platformio]
; Tylko to środowisko przy „Upload” w IDE (bez drugiego env naraz).
default_envs = nicla_vision

[env:nicla_vision]
platform = ststm32
board = nicla_vision
framework = arduino

monitor_speed = 115200

lib_deps =
    arduino-libraries/Arduino_LSM6DSOX@1.1.2
    pololu/VL53L1X@1.3.1
    arduino-libraries/ArduinoBLE@1.3.6

build_flags =
    -D HEFAS_STM_BUILD=1
    -D COMPONENT_4343W_FS

; Nicla Vision: USB DFU (2341:035f). Windows: docs/UPLOAD_NICLA_WINDOWS.md
upload_protocol = dfu
upload_flags =
    -d 2341:035f

; Domyślnie: BEZ COM / 1200 baud (unika PermissionError na COM8 w DFU).
; Przed uploadem: double-tap RESET → potem Upload.
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
board_upload.disable_flushing = yes
board_upload.require_upload_port = no

; Opcjonalnie: auto-reset przez COM (tylko jawnie):
;   pio run -e nicla_vision_auto -t upload
[env:nicla_vision_auto]
extends = env:nicla_vision
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.disable_flushing = no
board_upload.require_upload_port = yes
