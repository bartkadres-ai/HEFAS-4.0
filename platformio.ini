; HEFAS STM – Arduino Nicla Vision (ToF + IMU → HID mysz)

[env:nicla_vision]
platform = ststm32
board = nicla_vision
framework = arduino

monitor_speed = 115200

; Nicla Vision: wgrywanie przez USB DFU (double-tap RESET → 2341:035f).
; Windows: sterownik WinUSB — patrz docs/UPLOAD_NICLA_WINDOWS.md
upload_protocol = dfu
upload_flags =
    -d 2341:035f

lib_deps =
    arduino-libraries/Arduino_LSM6DSOX@1.1.2
    pololu/VL53L1X@1.3.1
    arduino-libraries/ArduinoBLE@1.3.6

build_flags =
    -D HEFAS_STM_BUILD=1
    -D COMPONENT_4343W_FS
