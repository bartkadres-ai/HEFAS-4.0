; ============================================================
;  HEFAS STM – Head-controlled Electronic Functional Assistive System
;  Platforma: Arduino Nicla Vision (STM32H747, Arduino Mbed OS)
; ============================================================

[env:nicla_vision]
platform = ststm32
board = nicla_vision
framework = arduino

monitor_speed = 115200

; Rdzeń M7 (domyślny) — USB HID + kamera + IMU w jednym firmware.
; Osobne środowisko M4 na przyszłość (inferencja w tle):
; [env:nicla_vision_m4]
; board = nicla_vision_m4

lib_deps =
    arduino-libraries/Arduino_LSM6DSOX@1.1.2

build_flags =
    -D HEFAS_STM_BUILD=1
    ; UWAGA: równoczesne USB HID + kamera wymaga weryfikacji na sprzęcie.
    ; Jeśli grabFrame() resetuje USB, rozważ BLE HID (config.h).
